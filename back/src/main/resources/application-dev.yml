# Banco criado antes no SQL Server Management Studio:  CREATE DATABASE tecnostar_db;
# A senha pode vir da variável de ambiente DB_PASSWORD (ou troque o valor padrão abaixo).
spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=tecnostar_db;integratedSecurity=false;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASSWORD:SUA_SENHA_AQUI}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update   # cria/ajusta as tabelas sozinho (ou use o script ddl_tecnostardb.sql com "none")
    properties:
      hibernate:
        show_sql: true   # mostra os SQLs no console (debug)

server:
  port: 8080
